<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日事报 · 待办与复盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    background: #e8e2d4;
    color: #1c1a15;
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 20px 48px;
  }

  /* ── 工具栏（不进入打印） ── */
  .toolbar {
    width: 100%; max-width: 680px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
    margin-bottom: 16px; font-size: 13px;
  }
  .tabs { display: flex; border: 1.5px solid #1c1a15; background: #f5f1e6; }
  .tabs span {
    padding: 7px 20px; cursor: pointer; letter-spacing: 3px; color: #6d6455;
    border-right: 1.5px solid #1c1a15;
  }
  .tabs span:last-child { border-right: none; }
  .tabs span.active { background: #1c1a15; color: #f5f1e6; }
  .nav { display: flex; gap: 8px; align-items: center; }
  .nav button, #print-btn {
    font-family: inherit; font-size: 12px; letter-spacing: 1px;
    background: #f5f1e6; border: 1.5px solid #1c1a15; color: #1c1a15;
    padding: 7px 14px; cursor: pointer;
  }
  .nav button:hover { background: #1c1a15; color: #f5f1e6; }
  #print-btn {
    background: #8a2e1f; border-color: #8a2e1f; color: #f5f1e6;
    letter-spacing: 3px; display: flex; align-items: center; gap: 8px;
  }
  #print-btn:hover { background: #6d2317; }
  #print-btn svg { display: block; }
  #print-btn:disabled { opacity: .6; cursor: wait; }

  /* ── 报纸本体 ── */
  .paper {
    width: 100%; max-width: 680px;
    background: #f5f1e6;
    padding: 40px 44px;
    box-shadow: 0 2px 6px rgba(0,0,0,.2), 0 16px 40px rgba(60,50,30,.25);
    border: 1px solid #d8d0bc;
    height: fit-content;
  }
  .masthead { text-align: center; border-bottom: 4px double #1c1a15; padding-bottom: 18px; }
  .masthead .eyebrow {
    display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: 1px; color: #6d6455;
    margin-bottom: 10px;
  }
  h1 { font-size: 44px; font-weight: 900; letter-spacing: 10px; }
  .masthead .slogan { font-size: 12px; color: #6d6455; margin-top: 8px; letter-spacing: 4px; }
  .dateline {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px;
    font-size: 12px; padding: 10px 2px;
    border-bottom: 1.5px solid #1c1a15; margin-bottom: 24px;
  }
  .headline { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
  .standfirst { font-size: 13px; color: #55503f; margin-bottom: 20px; line-height: 1.7; }

  #sections { display: flex; flex-direction: column; }
  .section { margin-bottom: 8px; }
  .section + .section { border-top: 1.5px solid #1c1a15; padding-top: 20px; margin-top: 16px; }

  /* ── 待办 ── */
  .input-row { display: flex; margin-bottom: 12px; border: 1.5px solid #1c1a15; }
  .input-row input {
    flex: 1; min-width: 0; border: none; background: #fffdf5; outline: none;
    font-family: inherit; font-size: 15px; padding: 12px 14px; color: #1c1a15;
  }
  .input-row input::placeholder { color: #a89e88; font-style: italic; }
  .input-row select {
    border: none; border-left: 1.5px solid #1c1a15; background: #fffdf5;
    font-family: inherit; font-size: 13px; padding: 0 10px; color: #55503f;
    outline: none; cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .input-row button {
    border: none; border-left: 1.5px solid #1c1a15;
    background: #1c1a15; color: #f5f1e6;
    font-family: inherit; font-size: 14px; letter-spacing: 3px;
    padding: 0 22px; cursor: pointer;
  }
  .input-row button:hover { background: #3a352a; }
  .filters {
    display: flex; margin-bottom: 24px;
    border-bottom: 1px solid #b5ab90; font-size: 13px;
  }
  .filters span {
    padding: 8px 20px; cursor: pointer; color: #6d6455; letter-spacing: 2px;
    border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .filters span.active { color: #1c1a15; font-weight: 700; border-bottom-color: #8a2e1f; }
  .filters span:hover { color: #1c1a15; }

  .columns { column-count: 2; column-gap: 28px; column-rule: 1px solid #cfc6ae; }
  .item {
    break-inside: avoid; margin-bottom: 20px;
    padding-bottom: 16px; border-bottom: 1px dotted #b5ab90;
  }
  .item .kicker {
    font-size: 10px; letter-spacing: 3px; color: #8a2e1f;
    margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;
  }
  .item .del {
    cursor: pointer; color: #a89e88; letter-spacing: 0; font-size: 11px;
    background: none; border: none; font-family: inherit;
  }
  .item .del:hover { color: #8a2e1f; text-decoration: underline; }
  .item .title { font-size: 16px; font-weight: 700; line-height: 1.5; }
  #list .item .title { cursor: pointer; }
  #list .item .title:hover { text-decoration: underline dotted #8a2e1f 1.5px; text-underline-offset: 4px; }
  .item .title[contenteditable="true"] {
    outline: 1.5px dashed #8a2e1f; outline-offset: 3px;
    text-decoration: none !important; cursor: text; background: #fffdf5;
  }
  .item.done .title { text-decoration: line-through; color: #9a9078; }
  #list .item.done .title:hover { text-decoration: line-through; }
  .item .meta { font-size: 11px; color: #6d6455; margin-top: 6px; font-style: italic; }
  .item .done-mark {
    display: inline-block; font-size: 11px; font-weight: bold;
    color: #8a2e1f; border: 1.5px solid #8a2e1f;
    padding: 1px 8px; margin-top: 7px; transform: rotate(-4deg);
    letter-spacing: 2px;
  }
  .urge-mark { transform: rotate(3deg); }
  .item.overdue .kicker { font-weight: 700; }
  .item.overdue .meta { color: #8a2e1f; }
  .item.prio-top { column-span: all; }
  .item.prio-top .title { font-size: 21px; line-height: 1.45; }
  .item.prio-brief { margin-bottom: 12px; padding-bottom: 10px; }
  .item.prio-brief .title { font-size: 13px; }
  .item.prio-brief .kicker { font-size: 9px; margin-bottom: 3px; }
  .empty {
    column-span: all; text-align: center; padding: 30px 0 38px;
    color: #a89e88; font-style: italic; font-size: 14px; line-height: 2;
  }
  .empty b { font-size: 18px; display: block; font-style: normal; color: #6d6455; letter-spacing: 4px; }

  /* ── 社论（复盘） ── */
  .byline {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; color: #6d6455; margin-bottom: 14px; font-style: italic;
  }
  .review-input {
    width: 100%; border: none; outline: none; resize: none;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", inherit;
    font-size: 16px; line-height: 32px; color: #2a251c;
    background: repeating-linear-gradient(0deg, transparent, transparent 31px, #ddd3ba 31px, #ddd3ba 32px);
    min-height: 128px; padding: 0 2px;
  }
  .review-input::placeholder { color: #b5a98d; }
  .article-render {
    display: none;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", inherit;
    font-size: 16px; line-height: 2; color: #2a251c;
    white-space: pre-wrap;
  }

  /* ── 存档摘录 ── */
  .digest-item { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px dotted #b5ab90; }
  .digest-item .d-date { font-size: 11px; letter-spacing: 2px; color: #8a2e1f; margin-bottom: 4px; }
  .digest-item .d-text {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", inherit;
    font-size: 14px; line-height: 1.9; color: #3d372b; white-space: pre-wrap;
  }

  .footer {
    margin-top: 8px; padding-top: 14px; border-top: 4px double #1c1a15;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
    font-size: 11px; color: #6d6455; letter-spacing: 1px;
  }
  .footer .clear { cursor: pointer; text-decoration: underline; }
  .footer .clear:hover { color: #8a2e1f; }

  /* ── 档案室 ── */
  #archive-modal {
    position: fixed; inset: 0; background: rgba(28,26,21,.55);
    display: none; align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
  }
  #archive-modal.open { display: flex; }
  .archive-card {
    background: #f5f1e6; border: 1px solid #d8d0bc; max-width: 380px; width: 100%;
    padding: 30px 32px; box-shadow: 0 16px 40px rgba(0,0,0,.4); text-align: center;
  }
  .archive-card h2 {
    font-size: 22px; letter-spacing: 8px; font-weight: 900;
    border-bottom: 3px double #1c1a15; padding-bottom: 12px; margin-bottom: 10px;
  }
  .archive-card .note { font-size: 12px; color: #6d6455; line-height: 1.8; margin-bottom: 18px; }
  .archive-card button {
    display: block; width: 100%; font-family: inherit; font-size: 14px;
    letter-spacing: 4px; padding: 12px 0; cursor: pointer; margin-bottom: 10px;
    border: 1.5px solid #1c1a15;
  }
  .archive-card .btn-export { background: #1c1a15; color: #f5f1e6; }
  .archive-card .btn-export:hover { background: #3a352a; }
  .archive-card .btn-import { background: #fffdf5; color: #1c1a15; }
  .archive-card .btn-import:hover { background: #ece5d2; }
  .archive-card .close {
    font-size: 12px; color: #6d6455; cursor: pointer; text-decoration: underline;
  }
  .archive-card .close:hover { color: #8a2e1f; }

  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #1c1a15; color: #f5f1e6; font-size: 13px; letter-spacing: 2px;
    padding: 10px 26px; opacity: 0; transition: transform .25s ease, opacity .25s ease;
    pointer-events: none; z-index: 10;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ── 送报开场：打字机动画 ── */
  #press-overlay {
    position: fixed; inset: 0; background: #e8e2d4; z-index: 100;
    display: none; align-items: center; justify-content: center;
  }
  body.intro-typing #press-overlay { display: flex; }
  body.intro-typing .paper-wrap, body.intro-typing .toolbar { visibility: hidden; }
  #type-line { font-size: 42px; font-weight: 900; letter-spacing: 14px; color: #1c1a15; }
  #type-line .caret {
    display: inline-block; width: .55em; height: 1.05em; background: #1c1a15;
    vertical-align: -0.12em; margin-left: 2px;
    animation: caret-blink .7s steps(1) infinite;
  }
  @keyframes caret-blink { 50% { opacity: 0; } }

  .paper-wrap { position: relative; width: 100%; max-width: 680px; }
  body.intro-printing .toolbar { visibility: hidden; }
  body.intro-printing .paper {
    animation: printout 3s steps(32, end) forwards;
  }
  @keyframes printout {
    from { clip-path: inset(0 0 100% 0); }
    to   { clip-path: inset(0 0 0 0); }
  }
  #print-head {
    display: none; position: absolute; left: -14px; right: -14px; height: 5px;
    background: #1c1a15; box-shadow: 0 3px 8px rgba(0,0,0,.35);
    pointer-events: none;
  }
  body.intro-printing #print-head { display: block; animation: head-down 3s steps(32, end) forwards; }
  @keyframes head-down { from { top: 0; } to { top: 100%; } }
  body.intro-printing .paper-wrap { animation: jitter .14s steps(2) infinite; }
  @keyframes jitter {
    0% { transform: translateX(0); }
    50% { transform: translateX(-1.5px); }
    100% { transform: translateX(1px); }
  }

  /* ── 印刷模式：隐藏交互件，显示纯排版 ── */
  body.printing .toolbar, body.printing .input-row, body.printing .filters,
  body.printing .item .del, body.printing .footer .clear,
  body.printing .review-input, body.printing .empty-hint { display: none !important; }
  body.printing .article-render { display: block; }
  body.printing .paper { box-shadow: none; }
  body.printing .section.print-hide { display: none; }

  @media (max-width: 560px) {
    .paper { padding: 28px 22px; }
    .columns { column-count: 1; }
    h1 { font-size: 34px; letter-spacing: 6px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="tabs" id="tabs">
    <span data-e="day" class="active">日 刊</span>
    <span data-e="week">周 刊</span>
    <span data-e="month">月 刊</span>
  </div>
  <div class="nav">
    <button id="nav-prev">‹ 前一期</button>
    <button id="nav-now">本 期</button>
    <button id="nav-next">后一期 ›</button>
  </div>
  <button id="print-btn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>
    印刷发行
  </button>
</div>

<div class="paper-wrap">
<div class="paper" id="paper">
  <div class="masthead">
    <div class="eyebrow"><span id="issue">第 — 期</span><span>今日事 · 今日毕</span><span>免费发行</span></div>
    <h1>今日事报</h1>
    <div class="slogan">—— 所载各事 · 办讫为凭 ——</div>
  </div>
  <div class="dateline">
    <span id="date-cn"></span>
    <span id="headline-brief"></span>
  </div>

  <div id="sections">
    <!-- 待办（仅今日的日刊） -->
    <div class="section" id="tasks-section">
      <div class="headline">本日待办要闻</div>
      <p class="standfirst" id="tasks-standfirst"></p>
      <form class="input-row" id="add-form">
        <input type="text" id="new-task" placeholder="向本报投稿新任务……" maxlength="60" autocomplete="off">
        <select id="new-mode" title="单篇只登一次；连载每天自动刊出（如晨跑）">
          <option value="once">单篇</option>
          <option value="serial">连载</option>
          <option value="project">专题</option>
        </select>
        <select id="new-prio" title="版位：头条最要紧，简讯是小事">
          <option value="normal">要闻</option>
          <option value="top">头条</option>
          <option value="brief">简讯</option>
        </select>
        <select id="new-cat">
          <option value="工作">工作</option>
          <option value="会议">会议</option>
          <option value="健康">健康</option>
          <option value="日常">日常</option>
          <option value="阅读">阅读</option>
          <option value="其他">其他</option>
        </select>
        <button type="submit">刊登</button>
      </form>
      <div class="filters" id="filters">
        <span data-f="all" class="active">全部</span>
        <span data-f="todo">未办</span>
        <span data-f="done">已办</span>
      </div>
      <div class="columns" id="list"></div>
    </div>

    <!-- 办讫纪事（往期日刊 / 周刊 / 月刊） -->
    <div class="section" id="archive-section">
      <div class="headline" id="archive-title">办讫纪事</div>
      <p class="standfirst" id="archive-standfirst"></p>
      <div class="columns" id="archive-list"></div>
    </div>

    <!-- 社论（复盘） -->
    <div class="section" id="review-section">
      <div class="headline" id="review-title">今日社论</div>
      <div class="byline">
        <span>主笔 · 陈鹏宇</span>
        <span class="empty-hint">手稿自动存档</span>
      </div>
      <textarea class="review-input" id="review-input" placeholder="在此撰写复盘：今天做成了什么？卡在了哪里？明天最要紧的一件事是什么……"></textarea>
      <div class="article-render" id="review-render"></div>
    </div>

    <!-- 社论存档（周刊/月刊） -->
    <div class="section" id="digest-section">
      <div class="headline" id="digest-title">每日社论存档</div>
      <p class="standfirst" id="digest-standfirst"></p>
      <div id="digest-list"></div>
    </div>
  </div>

  <div class="footer">
    <span>主编：陈鹏宇</span>
    <span id="stats"></span>
    <span class="clear" id="archive-room">档案室</span>
    <span class="clear" id="clear-done">清理已办稿件</span>
  </div>
</div>

<div id="print-head"></div>
</div>

<div id="press-overlay"><div id="type-line"></div></div>

<div id="archive-modal">
  <div class="archive-card">
    <h2>档 案 室</h2>
    <p class="note">档案含全部任务、复盘与办讫纪事。<br>「接收档案」会以档案内容<b>覆盖</b>本机现有数据，<br>换电脑时：旧机移交 → 新机接收。</p>
    <button class="btn-export" id="export-btn">移交档案（导出文件）</button>
    <button class="btn-import" id="import-btn">接收档案（从文件导入）</button>
    <span class="close" id="archive-close">关上档案室</span>
  </div>
</div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<div class="toast" id="toast"></div>

<script src="html2canvas.min.js"></script>
<script>
(function () {
  var TASK_KEY = 'newspaper-todo-v1';
  var REVIEW_KEY = 'newspaper-reviews-v1';
  var LOG_KEY = 'newspaper-donelog-v1';

  // 使用浏览器的当地日期；时间戳不再人为增加 12 小时。
  function unow() { return new Date(); }
  function stamp() { return Date.now(); }
  var SECTIONS = { '工作': '头版', '会议': '要闻', '健康': '体育版', '日常': '通讯', '阅读': '副刊', '其他': '街谈' };

  var SERIAL_KEY = 'newspaper-serials-v1';
  var tasks = load(TASK_KEY, []);
  var reviews = load(REVIEW_KEY, {});
  var doneLog = load(LOG_KEY, []);
  var serials = load(SERIAL_KEY, []);
  var filter = 'all';
  var edition = 'day';            // day | week | month
  var viewDate = unow();          // 当前浏览的期号所在日期

  // 保留迁移前副本，只校正旧版本人为偏移的时间戳；复盘日期不猜测。
  function migrateClock() {
    if (localStorage.getItem('newspaper-clock-v2')) return;
    var legacy = localStorage.getItem('newspaper-tz-v1');
    localStorage.setItem('newspaper-before-clock-v2', JSON.stringify({
      tasks: tasks, reviews: reviews, doneLog: doneLog, serials: serials
    }));
    if (legacy) {
      tasks.forEach(function (t) { t.created -= 12 * 3600e3; });
      doneLog.forEach(function (l) { l.at -= 12 * 3600e3; });
      serials.forEach(function (s) { s.start -= 12 * 3600e3; });
    }
    save(TASK_KEY, tasks); save(LOG_KEY, doneLog); save(SERIAL_KEY, serials);
    localStorage.setItem('newspaper-clock-v2', '1');
  }
  migrateClock();

  // 旧数据迁移：已完成但没有纪事记录的任务，补录一条
  tasks.forEach(function (t) {
    if (t.done && !doneLog.some(function (l) { return l.id === t.id; })) {
      doneLog.push({ id: t.id, text: t.text, cat: t.cat, at: t.created });
    }
  });
  save(LOG_KEY, doneLog);

  var $ = function (id) { return document.getElementById(id); };

  function load(k, fb) {
    try { return JSON.parse(localStorage.getItem(k)) || fb; } catch (e) { return fb; }
  }
  function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

  /* ── 日期工具 ── */
  var CN = '〇一二三四五六七八九';
  function p2(n) { return n < 10 ? '0' + n : '' + n; }
  function cnNum(n) {
    if (n <= 10) return n === 10 ? '十' : CN[n];
    if (n < 20) return '十' + (n % 10 ? CN[n % 10] : '');
    if (n < 100) return CN[Math.floor(n / 10)] + '十' + (n % 10 ? CN[n % 10] : '');
    return String(n).split('').map(function (c) { return CN[+c]; }).join('');
  }
  function cnYear(d) {
    return String(d.getFullYear()).split('').map(function (c) { return CN[+c]; }).join('') + '年';
  }
  function cnDate(d) {
    return cnYear(d) + cnNum(d.getMonth() + 1) + '月' + cnNum(d.getDate()) + '日 星期' + '日一二三四五六'[d.getDay()];
  }
  function cnMD(d) { return cnNum(d.getMonth() + 1) + '月' + cnNum(d.getDate()) + '日'; }
  function dayKey(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function sameDay(a, b) { return dayKey(a) === dayKey(b); }
  function isoWeek(d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() - (t.getDay() + 6) % 7 + 3);
    var ft = new Date(t.getFullYear(), 0, 4);
    ft.setDate(ft.getDate() - (ft.getDay() + 6) % 7 + 3);
    return { y: t.getFullYear(), w: 1 + Math.round((t - ft) / (7 * 864e5)) };
  }
  function weekRange(d) {
    var s = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    s.setDate(s.getDate() - (s.getDay() + 6) % 7);
    var e = new Date(s); e.setDate(s.getDate() + 6);
    return { start: s, end: e };
  }
  function monthRange(d) {
    return { start: new Date(d.getFullYear(), d.getMonth(), 1), end: new Date(d.getFullYear(), d.getMonth() + 1, 0) };
  }
  function inRange(ts, r) {
    var end = new Date(r.end); end.setHours(23, 59, 59, 999);
    return ts >= r.start.getTime() && ts <= end.getTime();
  }
  var EPOCH = new Date(2026, 8, 10);   // 创刊日（读者当地 2026-09-10）
  function issueLabel(kind, n) {
    return kind + ' · ' + (n < 1 ? '试刊号' : '第 ' + n + ' 期');
  }
  function reviewKey() {
    if (edition === 'day') return 'd:' + dayKey(viewDate);
    if (edition === 'week') { var w = isoWeek(viewDate); return 'w:' + w.y + '-W' + p2(w.w); }
    return 'm:' + viewDate.getFullYear() + '-' + p2(viewDate.getMonth() + 1);
  }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
  function fmtTime(ts) {
    var d = new Date(ts);
    return p2(d.getHours()) + ':' + p2(d.getMinutes());
  }

  /* ── 渲染 ── */
  function show(id, on) { $(id).style.display = on ? '' : 'none'; }

  // 连载专栏：每天自动刊出一回；隔天没办的连载稿随昨日报纸过期撤下（习惯过期不补）
  function serialNo(s) {
    var n = unow(), st = new Date(s.start);
    var a = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    var b = new Date(st.getFullYear(), st.getMonth(), st.getDate());
    return Math.round((a - b) / 864e5) + 1;
  }
  function spawnSerials() {
    if (!serials.length && !tasks.some(function (t) { return t.serialId; })) return;
    var today = dayKey(unow());
    var changed = false;
    serials.forEach(function (s) {
      if (tasks.some(function (t) {
        return t.serialId === s.id && (!t.done || dayKey(new Date(t.created)) === today);
      })) return;
      var nid = stamp();
      while (tasks.some(function (t) { return t.id === nid; })) nid++;
      tasks.push({ id: nid, text: s.text, cat: s.cat, prio: s.prio, done: false, created: stamp(), serialId: s.id });
      changed = true;
    });
    if (changed) save(TASK_KEY, tasks);
  }

  var PRIO_ORDER = { top: 0, normal: 1, brief: 2 };
  var PRIO_NAME = { top: '头条', brief: '简讯' };
  function prioOf(t) { return PRIO_ORDER[t.prio] !== undefined ? t.prio : 'normal'; }
  function daysSince(t) {
    var now = unow(), c = new Date(t.created);
    var today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var created0 = new Date(c.getFullYear(), c.getMonth(), c.getDate());
    return Math.round((today0 - created0) / 864e5);
  }
  function overdueDays(t) {
    if (t.done) return 0;
    // 专题在限期内不催办；超过限期按超出天数催办
    if (t.project) return t.limit ? Math.max(0, daysSince(t) + 1 - t.limit) : 0;
    return daysSince(t);
  }

  function tasksForToday() {
    var today = unow();
    return tasks.filter(function (t) {
      if (!t.done) return true;
      var log = doneLog.find(function (l) { return l.id === t.id; });
      return sameDay(new Date(log ? log.at : t.created), today);
    });
  }

  function renderTasks() {
    var list = $('list');
    var issueTasks = tasksForToday();
    var shown = issueTasks.filter(function (t) {
      return filter === 'all' || (filter === 'done' ? t.done : !t.done);
    });
    shown.sort(function (a, b) {
      var oa = overdueDays(a) > 0 ? 0 : 1, ob = overdueDays(b) > 0 ? 0 : 1;
      if (oa !== ob) return oa - ob;
      var pa = PRIO_ORDER[prioOf(a)], pb = PRIO_ORDER[prioOf(b)];
      if (pa !== pb) return pa - pb;
      if (a.done !== b.done) return a.done ? 1 : -1;
      return b.created - a.created;
    });
    if (!shown.length) {
      var msgs = {
        all: '<b>本日暂无稿件</b>版面虚位以待，请在上方投稿栏刊登第一条任务',
        todo: '<b>未办事项已清零</b>诸事办讫，本报向您致以敬意',
        done: '<b>尚无已办稿件</b>完成一件，此处便刊登一件'
      };
      list.innerHTML = '<div class="empty">' + msgs[filter] + '</div>';
    } else {
      list.innerHTML = shown.map(function (t) {
        var od = overdueDays(t);
        var prio = prioOf(t);
        var ser = t.serialId && serials.find(function (x) { return x.id === t.serialId; });
        var cls = 'item' + (t.done ? ' done' : '') + (od > 0 ? ' overdue' : '') +
          (prio !== 'normal' ? ' prio-' + prio : '');
        var topMark = prio === 'top' ? '头条' : '';
        var kicker = od > 0 ? '催办 · ' + esc(t.cat)
          : t.project ? topMark + '专题 · ' + esc(t.cat)
          : ser ? topMark + '连载 · ' + esc(t.cat)
          : PRIO_NAME[prio] ? PRIO_NAME[prio] + ' · ' + esc(t.cat)
          : (SECTIONS[t.cat] || '街谈') + ' · ' + esc(t.cat);
        var tail;
        if (t.done) tail = '<span class="done-mark">' + (t.project ? '结 案' : '已 办') + '</span>';
        else if (od > 0) tail = '<span class="done-mark urge-mark">催 办</span>' +
          '<div class="meta">' + (t.project ? '已超期' : '已悬') + cnNum(od) + '日 · 编辑部催办</div>';
        else if (t.project) tail = '<div class="meta">专题第' + cnNum(daysSince(t) + 1) + '天' +
          (t.limit ? ' · 限' + cnNum(t.limit) + '天' : '') + '</div>';
        else if (ser) tail = '<div class="meta">连载第' + cnNum(serialNo(ser)) + '回 · 每日专栏</div>';
        else tail = '<div class="meta">投稿于 ' + fmtTime(t.created) + '</div>';
        return '<div class="' + cls + '" data-id="' + t.id + '">' +
          '<div class="kicker"><span>' + kicker + '</span>' +
          '<button class="del" title="删除此条">撤稿</button></div>' +
          '<div class="title" title="单击划记完成 · 双击修改">' + esc(t.text) + '</div>' +
          tail + '</div>';
      }).join('');
    }
    var total = issueTasks.length, done = issueTasks.filter(function (t) { return t.done; }).length;
    var urgent = issueTasks.filter(function (t) { return overdueDays(t) > 0; }).length;
    $('tasks-standfirst').textContent = (total === 0
      ? '据本报记者报道，编辑部今日暂未收到任何稿件。市民如有待办事宜，欢迎随时来函刊登。'
      : done === total
      ? '据本报记者报道，今日全部 ' + total + ' 项事务均已办结。相关人士表示："今晚可以睡个好觉了。"'
      : '据本报记者报道，今日共有 ' + total + ' 项事务待办，其中 ' + done + ' 项已顺利完成。相关人士表示："剩下的这就去办。"')
      + (urgent ? '另有 ' + urgent + ' 件隔夜悬案，编辑部已发出催办函。' : '');
  }

  function renderDayArchive(d) {
    var issueTasks = tasks.filter(function (t) { return sameDay(new Date(t.created), d); });
    var known = {};
    issueTasks.forEach(function (t) { known[t.id] = true; });
    var entries = issueTasks.map(function (t) {
      var log = doneLog.find(function (l) { return l.id === t.id; });
      return { id: t.id, text: t.text, cat: t.cat, created: t.created, done: t.done, doneAt: log && log.at };
    });
    doneLog.forEach(function (l) {
      if (!known[l.id] && sameDay(new Date(l.at), d)) {
        entries.push({ id: l.id, text: l.text, cat: l.cat, created: l.at, done: true, doneAt: l.at });
      }
    });
    entries.sort(function (a, b) { return b.created - a.created; });
    var done = entries.filter(function (t) { return t.done; }).length;
    $('archive-title').textContent = '当日刊载';
    $('archive-standfirst').textContent = entries.length
      ? '本期共刊登事务 ' + entries.length + ' 件，其中已办 ' + done + ' 件、未办 ' + (entries.length - done) + ' 件。'
      : '本期未刊登待办事项。';
    $('archive-list').innerHTML = entries.map(function (t) {
      return '<div class="item' + (t.done ? ' done' : '') + '">' +
        '<div class="kicker"><span>' + (SECTIONS[t.cat] || '街谈') + ' · ' + esc(t.cat) + '</span></div>' +
        '<div class="title">' + esc(t.text) + '</div>' +
        (t.done
          ? '<span class="done-mark">已 办</span><div class="meta">办讫于 ' + cnMD(new Date(t.doneAt || t.created)) + ' ' + fmtTime(t.doneAt || t.created) + '</div>'
          : '<div class="meta">当期未办</div>') +
        '</div>';
    }).join('');
    return done;
  }

  function renderArchive(range, label) {
    var entries = doneLog.filter(function (l) { return inRange(l.at, range); })
      .sort(function (a, b) { return b.at - a.at; });
    var el = $('archive-list');
    $('archive-title').textContent = label + '办讫纪事';
    $('archive-standfirst').textContent = entries.length
      ? '据本报编辑部统计，' + label + '共办结事务 ' + entries.length + ' 件，现将各件纪事存档如下。'
      : '本期暂无办讫纪事。事情办成一件，本栏便记上一笔。';
    el.innerHTML = entries.map(function (l) {
      var d = new Date(l.at);
      return '<div class="item done">' +
        '<div class="kicker"><span>' + (SECTIONS[l.cat] || '街谈') + ' · ' + esc(l.cat) + '</span></div>' +
        '<div class="title">' + esc(l.text) + '</div>' +
        '<div class="meta">办讫于 ' + cnMD(d) + ' ' + fmtTime(l.at) + '</div>' +
        '</div>';
    }).join('') || '';
    return entries.length;
  }

  function renderDigest(items, title, standfirst) {
    $('digest-title').textContent = title;
    $('digest-standfirst').textContent = standfirst;
    $('digest-list').innerHTML = items.map(function (it) {
      return '<div class="digest-item"><div class="d-date">' + it.label + '</div>' +
        '<div class="d-text">' + esc(it.text) + '</div></div>';
    }).join('');
    return items.length;
  }

  function render() {
    spawnSerials();
    var isToday = sameDay(viewDate, unow());
    var rk = reviewKey();
    var reviewText = reviews[rk] || '';

    // 各版块显隐
    var showTasks = edition === 'day' && isToday;
    show('tasks-section', showTasks);
    show('archive-section', !showTasks);
    show('digest-section', false);
    $('clear-done').style.display = showTasks ? '' : 'none';

    // 社论输入
    var input = $('review-input');
    input.value = reviewText;
    $('review-render').textContent = reviewText;
    autoGrow(input);
    $('review-section').classList.toggle('print-hide', !reviewText.trim());

    var doneCount = 0, reviewCount = 0;

    if (edition === 'day') {
      var w = '日一二三四五六'[viewDate.getDay()];
      $('date-cn').textContent = cnDate(viewDate);
      var d0 = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate());
      $('issue').textContent = issueLabel('日刊', Math.round((d0 - EPOCH) / 864e5) + 1);
      $('review-title').textContent = '今日社论';
      input.placeholder = '在此撰写今日复盘：今天做成了什么？卡在了哪里？明天最要紧的一件事是什么……';
      if (showTasks) {
        renderTasks();
        var todayTasks = tasksForToday();
        doneCount = todayTasks.filter(function (t) { return t.done; }).length;
        var total = todayTasks.length;
        var urgent = todayTasks.filter(function (t) { return overdueDays(t) > 0; }).length;
        $('headline-brief').textContent = urgent ? '本日头条：' + cnNum(urgent) + '件催办中'
          : total === 0 ? '本日头条：静候投稿'
          : doneCount === total ? '号外：诸事已毕！'
          : '本日头条：尚有' + cnNum(total - doneCount) + '事未办';
      } else {
        var d0 = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate());
        doneCount = renderDayArchive(d0);
        $('headline-brief').textContent = '往期存档 · 星期' + w;
      }
    } else if (edition === 'week') {
      var iw = isoWeek(viewDate), r = weekRange(viewDate);
      $('date-cn').textContent = cnYear(r.start) + '第' + cnNum(iw.w) + '周 · ' + cnMD(r.start) + '至' + cnMD(r.end);
      $('issue').textContent = issueLabel('周刊', Math.round((r.start - weekRange(EPOCH).start) / (7 * 864e5)) + 1);
      $('review-title').textContent = '一周综述';
      input.placeholder = '在此撰写周复盘：本周主线是什么？哪件事最值得记一笔？下周想改进什么……';
      doneCount = renderArchive(r, '本周');

      // 每日社论存档
      var items = [];
      for (var i = 0; i < 7; i++) {
        var d = new Date(r.start); d.setDate(r.start.getDate() + i);
        var t = reviews['d:' + dayKey(d)];
        if (t && t.trim()) items.push({ label: cnMD(d) + ' · 星期' + '日一二三四五六'[d.getDay()], text: t });
      }
      reviewCount = items.length;
      if (items.length) {
        show('digest-section', true);
        renderDigest(items, '每日社论存档', '本周共刊发每日社论 ' + items.length + ' 篇，全文存档如下。');
      }
      $('headline-brief').textContent = '本周办结' + cnNum(doneCount) + '件 · 社论' + cnNum(reviewCount) + '篇';
    } else {
      var mr = monthRange(viewDate);
      $('date-cn').textContent = cnYear(viewDate) + cnNum(viewDate.getMonth() + 1) + '月 · 月度特刊';
      $('issue').textContent = issueLabel('月刊', (viewDate.getFullYear() - EPOCH.getFullYear()) * 12 + viewDate.getMonth() - EPOCH.getMonth() + 1);
      $('review-title').textContent = '本月特刊';
      input.placeholder = '在此撰写月复盘：这个月最大的收获？最大的遗憾？下个月的主题是什么……';
      doneCount = renderArchive(mr, '本月');

      // 各周综述存档
      var wItems = [];
      var cur = weekRange(mr.start).start;
      while (cur <= mr.end) {
        var wi = isoWeek(cur);
        var wt = reviews['w:' + wi.y + '-W' + p2(wi.w)];
        if (wt && wt.trim()) wItems.push({ label: '第' + cnNum(wi.w) + '周综述', text: wt });
        cur = new Date(cur); cur.setDate(cur.getDate() + 7);
      }
      reviewCount = wItems.length;
      if (wItems.length) {
        show('digest-section', true);
        renderDigest(wItems, '各周综述存档', '本月共刊发周综述 ' + wItems.length + ' 篇，全文存档如下。');
      }
      $('headline-brief').textContent = '本月办结' + cnNum(doneCount) + '件 · 综述' + cnNum(reviewCount) + '篇';
    }

    // 页脚
    if (showTasks) {
      var currentTasks = tasksForToday();
      var tt = currentTasks.length, dd = currentTasks.filter(function (t) { return t.done; }).length;
      $('stats').textContent = '完成率 ' + (tt ? Math.round(dd / tt * 100) : 0) + '% · 共 ' + tt + ' 条';
    } else {
      $('stats').textContent = '本期办结 ' + doneCount + ' 件';
    }
  }

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.max(128, el.scrollHeight) + 'px';
  }

  /* ── 事件 ── */
  $('add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('new-task');
    var text = input.value.trim();
    if (!text) { input.focus(); return; }
    var mode = $('new-mode').value;
    var isSerial = mode === 'serial';
    var item = { id: stamp(), text: text, cat: $('new-cat').value, prio: $('new-prio').value, done: false, created: stamp() };
    if (mode === 'project') {
      item.project = true;
      var lim = prompt('专题「' + text + '」预计几天完成？\n填数字设截稿期（超期会被催办），留空则不设。', '');
      lim = parseInt(lim, 10);
      if (lim > 0) item.limit = lim;
      $('new-mode').value = 'once';
    }
    // 头条唯一制：头版头条只有一条，新头条上版，旧头条（未办的）降为要闻
    var demoted = false;
    if (item.prio === 'top') {
      tasks.forEach(function (t) {
        if (!t.done && prioOf(t) === 'top') { t.prio = 'normal'; demoted = true; }
      });
    }
    if (isSerial) {
      var sid = item.id;
      serials.push({ id: sid, text: text, cat: item.cat, prio: item.prio, start: item.created });
      save(SERIAL_KEY, serials);
      item.serialId = sid;
      $('new-mode').value = 'once';
    }
    tasks.unshift(item);
    input.value = '';
    input.focus();
    save(TASK_KEY, tasks); render();
    toast((isSerial ? '连载专栏已开设，每日自动刊出'
      : item.project ? '专题已立项，每日跟踪报道'
      : '已刊登') + (demoted ? '；旧头条降为要闻' : ''));
  });

  $('filters').addEventListener('click', function (e) {
    var s = e.target.closest('span[data-f]');
    if (!s) return;
    filter = s.dataset.f;
    this.querySelectorAll('span').forEach(function (el) { el.classList.remove('active'); });
    s.classList.add('active');
    renderTasks();
  });

  $('list').addEventListener('click', function (e) {
    var item = e.target.closest('.item');
    if (!item) return;
    var id = +item.dataset.id;
    var task = tasks.find(function (t) { return t.id === id; });
    if (!task) return;

    if (e.target.classList.contains('del')) {
      if (task.serialId) {
        var ser = serials.find(function (x) { return x.id === task.serialId; });
        var no = ser ? '（已连载第' + cnNum(serialNo(ser)) + '回）' : '';
        if (!confirm('「' + task.text + '」是连载专栏' + no + '。\n撤稿即停刊：今后每天不再自动刊出。\n确定停刊？')) return;
        serials = serials.filter(function (x) { return x.id !== task.serialId; });
        save(SERIAL_KEY, serials);
      } else {
        if (!confirm('确定撤下这条稿件？\n「' + task.text + '」')) return;
      }
      tasks = tasks.filter(function (t) { return t.id !== id; });
      save(TASK_KEY, tasks); render();
      toast(task.serialId ? '专栏已停刊' : '已撤稿');
      return;
    }
    if (e.target.classList.contains('title')) {
      if (e.target.isContentEditable) return;
      if (task.project && !task.done &&
          !confirm('专题「' + task.text + '」宣告结案？\n（追踪了' + cnNum(daysSince(task) + 1) + '天）')) return;
      task.done = !task.done;
      if (task.done) {
        doneLog.push({ id: task.id, text: task.text, cat: task.cat, at: stamp() });
      } else {
        for (var i = doneLog.length - 1; i >= 0; i--) {
          if (doneLog[i].id === task.id) { doneLog.splice(i, 1); break; }
        }
      }
      save(TASK_KEY, tasks); save(LOG_KEY, doneLog); render();
      toast(task.done ? (task.project ? '专题结案，可喜可贺' : '办讫，盖章存档')
                      : (task.project ? '专题重新立案' : '重新列为待办'));
    }
  });

  $('list').addEventListener('dblclick', function (e) {
    var title = e.target.closest('.title');
    if (!title || title.isContentEditable) return;
    var id = +title.closest('.item').dataset.id;
    var task = tasks.find(function (t) { return t.id === id; });
    if (!task) return;

    title.contentEditable = 'true';
    title.focus();
    document.getSelection().selectAllChildren(title);

    function finish(commit) {
      title.contentEditable = 'false';
      var text = title.textContent.trim();
      if (commit && text) {
        task.text = text;
        doneLog.forEach(function (l) { if (l.id === task.id) l.text = text; });
        if (task.serialId) {
          serials.forEach(function (s) { if (s.id === task.serialId) s.text = text; });
          save(SERIAL_KEY, serials);
        }
        save(TASK_KEY, tasks); save(LOG_KEY, doneLog);
        toast('已改稿');
      }
      render();
    }
    title.addEventListener('blur', function () { finish(true); }, { once: true });
    title.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); title.blur(); }
      if (ev.key === 'Escape') { title.textContent = task.text; title.blur(); }
    });
  });

  $('clear-done').addEventListener('click', function () {
    var currentIds = {};
    tasksForToday().forEach(function (t) { currentIds[t.id] = true; });
    var n = tasks.filter(function (t) { return currentIds[t.id] && t.done; }).length;
    if (!n) { toast('没有可清理的已办稿件'); return; }
    if (!confirm('将 ' + n + ' 条已办稿件从版面撤下？\n（办讫纪事已存档，周刊 / 月刊仍可查到）')) return;
    tasks = tasks.filter(function (t) { return !(currentIds[t.id] && t.done); });
    save(TASK_KEY, tasks); render();
    toast('已清理 ' + n + ' 条');
  });

  // 社论自动保存
  $('review-input').addEventListener('input', function () {
    var rk = reviewKey();
    if (this.value.trim()) reviews[rk] = this.value;
    else delete reviews[rk];
    save(REVIEW_KEY, reviews);
    $('review-render').textContent = this.value;
    $('review-section').classList.toggle('print-hide', !this.value.trim());
    autoGrow(this);
  });

  // 刊别切换与翻期
  $('tabs').addEventListener('click', function (e) {
    var s = e.target.closest('span[data-e]');
    if (!s) return;
    edition = s.dataset.e;
    this.querySelectorAll('span').forEach(function (el) { el.classList.remove('active'); });
    s.classList.add('active');
    render();
  });
  function shift(n) {
    if (edition === 'day') viewDate.setDate(viewDate.getDate() + n);
    else if (edition === 'week') viewDate.setDate(viewDate.getDate() + n * 7);
    else viewDate.setMonth(viewDate.getMonth() + n);
    render();
  }
  $('nav-prev').addEventListener('click', function () { shift(-1); });
  $('nav-next').addEventListener('click', function () { shift(1); });
  $('nav-now').addEventListener('click', function () { viewDate = unow(); render(); });

  // 档案室：数据导出 / 导入
  var modal = $('archive-modal');
  $('archive-room').addEventListener('click', function () { modal.classList.add('open'); });
  $('archive-close').addEventListener('click', function () { modal.classList.remove('open'); });
  modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.remove('open'); });

  $('export-btn').addEventListener('click', function () {
    var payload = {
      app: 'newspaper-todo', version: 3, clockVersion: 2, exportedAt: stamp(),
      tasks: tasks, reviews: reviews, doneLog: doneLog, serials: serials
    };
    var blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '今日事报_档案_' + dayKey(unow()) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('档案已移交，请查收下载');
  });

  $('import-btn').addEventListener('click', function () { $('import-file').click(); });
  $('import-file').addEventListener('change', function () {
    var file = this.files[0];
    this.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var p;
      try { p = JSON.parse(reader.result); } catch (e) { p = null; }
      if (!p || p.app !== 'newspaper-todo' || !Array.isArray(p.tasks) || !Array.isArray(p.doneLog) ||
          typeof p.reviews !== 'object' || p.reviews === null) {
        toast('档案无效：不是本报的档案文件');
        return;
      }
      var ok = confirm('接收档案将覆盖本机现有数据：\n' +
        '本机：' + tasks.length + ' 条任务 · ' + Object.keys(reviews).length + ' 篇复盘 · ' + doneLog.length + ' 条纪事\n' +
        '档案：' + p.tasks.length + ' 条任务 · ' + Object.keys(p.reviews).length + ' 篇复盘 · ' + p.doneLog.length + ' 条纪事\n\n确定接收？');
      if (!ok) return;
      tasks = p.tasks; reviews = p.reviews; doneLog = p.doneLog; serials = p.serials || [];
      save(TASK_KEY, tasks); save(REVIEW_KEY, reviews); save(LOG_KEY, doneLog); save(SERIAL_KEY, serials);
      if (p.clockVersion !== 2) {
        localStorage.removeItem('newspaper-clock-v2');
        localStorage.setItem('newspaper-tz-v1', '1');
        migrateClock();
      }
      modal.classList.remove('open');
      render();
      toast('档案接收完毕，已归档入库');
    };
    reader.readAsText(file);
  });

  // 印刷发行：整版导出 PNG
  $('print-btn').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    document.body.classList.add('printing');
    html2canvas($('paper'), { scale: 2, backgroundColor: '#f5f1e6' }).then(function (canvas) {
      var name;
      if (edition === 'day') name = '今日事报_日刊_' + dayKey(viewDate);
      else if (edition === 'week') { var w = isoWeek(viewDate); name = '今日事报_周刊_' + w.y + '年第' + w.w + '周'; }
      else name = '今日事报_月刊_' + viewDate.getFullYear() + '-' + p2(viewDate.getMonth() + 1);
      var a = document.createElement('a');
      a.download = name + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      toast('本期已付印，请查收下载');
    }).catch(function () {
      toast('印刷失败，请重试');
    }).finally(function () {
      document.body.classList.remove('printing');
      btn.disabled = false;
    });
  });

  var observedDay = dayKey(unow());
  function checkDayChange() {
    var now = unow(), nextDay = dayKey(now);
    if (nextDay === observedDay) return;
    if (edition === 'day' && dayKey(viewDate) === observedDay) viewDate = now;
    observedDay = nextDay;
    render();
  }
  window.addEventListener('focus', checkDayChange);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) checkDayChange();
  });
  setInterval(checkDayChange, 30000);
  render();

  /* ── 送报开场：报头逐字敲出 → 整版逐行打印 ── */
  (function intro() {
    var LAST = 'newspaper-lastprint';
    var today = dayKey(unow());
    var byUrl = new URLSearchParams(location.search).get('press') === '1';
    if (!byUrl && localStorage.getItem(LAST) === today) return;
    localStorage.setItem(LAST, today);

    var body = document.body;
    var line = $('type-line');
    var title = '今日事报';
    var timers = [];
    body.classList.add('intro-typing');

    function done(e) {
      if (e) { e.stopPropagation(); e.preventDefault(); }
      timers.forEach(clearTimeout);
      body.classList.remove('intro-typing');
      body.classList.remove('intro-printing');
      document.removeEventListener('click', done, true);
      document.removeEventListener('keydown', done, true);
    }
    document.addEventListener('click', done, true);
    document.addEventListener('keydown', done, true);

    var i = 0;
    (function typeNext() {
      line.innerHTML = esc(title.slice(0, i)) + '<span class="caret"></span>';
      if (i++ < title.length) timers.push(setTimeout(typeNext, 280));
      else timers.push(setTimeout(startPrint, 700));
    })();
    function startPrint() {
      body.classList.remove('intro-typing');
      body.classList.add('intro-printing');
      timers.push(setTimeout(done, 3150));
    }
  })();
})();
</script>
</body>
</html>
